services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - escala24_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    image: ghcr.io/leftson13/escala-24-backend:${ESCALA24_VERSION:-1.0.0}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
      ESCALA24_INITIAL_ADMIN_ENABLED: ${ESCALA24_INITIAL_ADMIN_ENABLED:-false}
      ESCALA24_INITIAL_ADMIN_NAME: ${ESCALA24_INITIAL_ADMIN_NAME:-}
      ESCALA24_INITIAL_ADMIN_EMAIL: ${ESCALA24_INITIAL_ADMIN_EMAIL:-}
      ESCALA24_INITIAL_ADMIN_PASSWORD: ${ESCALA24_INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8080/actuator/health > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: ghcr.io/leftson13/escala-24-frontend:${ESCALA24_VERSION:-1.0.0}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  escala24_postgres_data:
