name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate JavaScript and Nginx image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: node --check frontend/app.js

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag escala24-frontend:test frontend

      - name: Validate Nginx configuration
        run: docker run --rm --add-host backend:127.0.0.1 escala24-frontend:test nginx -t