spring.application.name=escala24

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/escala24}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:escala24_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:escala24_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

escala24.bootstrap.admin.enabled=${ESCALA24_INITIAL_ADMIN_ENABLED:false}
escala24.bootstrap.admin.name=${ESCALA24_INITIAL_ADMIN_NAME:}
escala24.bootstrap.admin.email=${ESCALA24_INITIAL_ADMIN_EMAIL:}
escala24.bootstrap.admin.password=${ESCALA24_INITIAL_ADMIN_PASSWORD:}
