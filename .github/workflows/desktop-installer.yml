name: Desktop Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-installer.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check offline.js
          node --check setup.js

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content "package.json" | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")

          if ($packageVersion -ne $tagVersion) {
            throw "A versão do package.json ($packageVersion) não corresponde à tag ($tagVersion)."
          }

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: escala-24-windows-installer
          path: desktop/out/Escala 24-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "out\Escala 24-Setup-*.exe" |
            Select-Object -First 1

          if (-not $installer) {
            throw "O instalador não foi encontrado."
          }

          gh release create "${{ github.ref_name }}" `
            "$($installer.FullName)" `
            --verify-tag `
            --title "Escala 24 ${{ github.ref_name }}" `
            --generate-notes