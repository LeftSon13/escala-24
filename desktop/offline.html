<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala 24</title>
    <style>
        :root {
            color: #f8fafc;
            background: #071426;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 85% 15%, #174576, transparent 32%), #071426;
            place-items: center;
        }

        main {
            width: min(540px, calc(100% - 48px));
            padding: 42px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
            color: #172033;
        }

        .brand {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 22px;
            font-weight: 750;
        }

        .brand span {
            display: grid;
            width: 44px;
            height: 44px;
            background: #2563eb;
            border-radius: 12px;
            color: white;
            place-items: center;
        }

        h1 {
            margin: 32px 0 12px;
            font-size: 28px;
        }

        p, li {
            color: #52627a;
            line-height: 1.6;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px 18px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <div class="brand"><span>24</span> Escala 24</div>
        <h1>O servidor local não está disponível</h1>
        <p>O aplicativo desktop encontrou a janela, mas não conseguiu se conectar ao Escala 24.</p>
        <p>Confirme se os serviços locais estão em execução:</p>
        <ol>
            <li>Abra o Docker Desktop.</li>
            <li>Inicie os serviços do Escala 24.</li>
            <li>Clique no botão abaixo.</li>
        </ol>
        <button id="retry-button" type="button">Tentar novamente</button>
    </main>
    <script src="offline.js"></script>
</body>
</html>
